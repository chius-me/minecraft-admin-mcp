name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - name: Validate Compose
        env:
          MC_RCON_PASSWORD: ci-rcon-password
          MC_MCP_TOKEN: ci-token-at-least-32-characters-long
        run: docker compose config --quiet


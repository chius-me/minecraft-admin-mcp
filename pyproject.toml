[project]
name = "minecraft-admin-mcp"
version = "0.3.0"
description = "A least-privilege MCP server for administering one Minecraft Java server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastmcp>=2.12,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6.0,<7",
  "rcon>=2.4,<3",
  "psutil>=6.1,<8",
  "zstandard>=0.23,<1",
]

[project.scripts]
minecraft-admin-mcp = "minecraft_admin_mcp.__main__:main"
minecraft-admin-mcp-approve = "minecraft_admin_mcp.admin_cli:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
  "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["minecraft_admin_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

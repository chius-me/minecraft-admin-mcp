server:
  id: test
  name: Test Server
  aliases: [test]
  environment: development
  risk_level: low
minecraft:
  version: "1.21.1"
  loader: fabric
  data_directory: /minecraft
  log_file: /minecraft/logs/latest.log
  world_directories: [/minecraft/world]
rcon:
  host: minecraft
  port: 25575
  password_env: MC_RCON_PASSWORD
  timeout_seconds: 5
http:
  host: 0.0.0.0
  port: 8101
  path: /mcp
  token_env: MC_MCP_TOKEN
audit:
  database: /var/lib/minecraft-admin-mcp/audit.db
backup:
  directory: /backups
  compression: zstd
  retention_count: 3
  timeout_seconds: 300
logs:
  default_lines: 50
  maximum_lines: 200
  maximum_characters: 20000
  redact_ip_addresses: true
permissions:
  get_identity: allow
  get_status: allow
  list_players: allow
  get_whitelist: allow
  broadcast: allow
  whitelist_add: allow
  whitelist_remove: allow
  kick_player: allow
  save_world: allow
  get_metrics: allow
  get_recent_events: allow
  get_recent_errors: allow
  create_backup: allow
  list_backups: allow

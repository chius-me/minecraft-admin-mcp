server:
  id: survival
  name: Main Survival Server
  aliases: [survival, main]
  environment: production
  risk_level: high

minecraft:
  version: "1.21.1"
  loader: fabric
  data_directory: /minecraft
  log_file: /minecraft/logs/latest.log
  world_directories:
    - /minecraft/world
    - /minecraft/world_nether
    - /minecraft/world_the_end

rcon:
  host: minecraft
  port: 25575
  password_env: MC_RCON_PASSWORD
  timeout_seconds: 10

http:
  host: 0.0.0.0
  port: 8101
  path: /mcp
  token_env: MC_MCP_TOKEN

audit:
  database: /var/lib/minecraft-admin-mcp/audit.db

# V0.3 approval queue. Admin token is read from admin_token_env (never put secrets in YAML).
approval:
  default_ttl_seconds: 3600
  admin_token_env: MC_ADMIN_TOKEN

backup:
  directory: /backups
  compression: zstd
  retention_count: 7
  timeout_seconds: 600

logs:
  default_lines: 100
  maximum_lines: 500
  maximum_characters: 30000
  redact_ip_addresses: true

permissions:
  get_identity: allow
  get_status: allow
  list_players: allow
  get_whitelist: allow
  broadcast: allow
  whitelist_add: allow
  whitelist_remove: allow
  kick_player: allow
  save_world: allow
  get_metrics: allow
  get_recent_events: allow
  get_recent_errors: allow
  create_backup: allow
  list_backups: allow
  # High-risk (V0.3): approval registers request_* only; allow is for isolated test servers.
  restart: disabled
  ban_player: disabled
  restore_backup: disabled

rate_limits:
  broadcast: { calls: 5, period_seconds: 60 }
  kick_player: { calls: 10, period_seconds: 60 }
  whitelist_write: { calls: 20, period_seconds: 60 }
  create_backup: { calls: 1, period_seconds: 300 }
  ban_player: { calls: 5, period_seconds: 60 }
  restart: { calls: 1, period_seconds: 300 }
  restore_backup: { calls: 1, period_seconds: 600 }
  request_high_risk: { calls: 10, period_seconds: 60 }
